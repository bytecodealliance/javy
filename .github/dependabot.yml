version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 100
    # Wasmtime major upgrades are done by hand: they must be bumped in
    # lockstep with other crates (e.g. `deterministic-wasi-ctx`) and
    # usually require code changes, so Dependabot PRs for them never
    # succeed on their own.
    ignore:
      - dependency-name: "wasmtime*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "deterministic-wasi-ctx"
    groups:
      wasmtime:
        patterns:
          - "wasmtime*"
      nonbreaking:
        exclude-patterns:
          - "rquickjs*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/npm/javy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 100
    groups:
      nonbreaking:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/book"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 100
    groups:
      nonbreaking:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
